name: Android APK

on:
  push:
    branches: [main]
    paths:
      - android/**
      - crates/kog-android-audio/**
      - crates/kog-audio/**
      - vendor/compress-tools/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - crates/kog-android-audio/**
      - crates/kog-audio/**
      - vendor/compress-tools/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build arm64 Kog decoders
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" android/native/build.sh arm64-v8a
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: kog-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
