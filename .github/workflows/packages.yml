name: Cross-platform packages

# Manual only until the Actions quota resets on 2026-11-01; restore the push
# and pull_request triggers then.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Package to build
        type: choice
        options: [all, linux, flatpak, windows, macos, android, ios]
        default: all
      build_cli:
        description: Build standalone terminal and headless server binaries
        type: boolean
        default: true
      mobile_only:
        description: Build only Android and iOS packages
        type: boolean
        default: false
      source_ref:
        description: Optional source tag or commit for a manual build (does not publish)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}-${{ inputs.source_ref || 'current' }}-${{ inputs.mobile_only && 'mobile' || 'all' }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-appimage:
    name: Linux AppImage and portable bundle
    if: (github.event_name != 'workflow_dispatch' || !inputs.mobile_only) && (!inputs.platform || inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake curl file libarchive-dev libasound2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libfuse2t64 \
            libqt6svg6-dev libswresample-dev libwayland-dev libxkbcommon-dev \
            ninja-build patchelf pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-webengine-dev qt6-webchannel-dev \
            qml6-module-qt-labs-platform qml6-module-qt-labs-settings qml6-module-qtqml-models \
            qml6-module-qtwebchannel qml6-module-qtwebengine \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window zlib1g-dev mold

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kog-linux
          # Release builds run on tags via workflow_dispatch, where the
          # default save-if is false: always refresh the cache instead.
          save-if: ${{ true }}

      - name: Build web frontend
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          crates/kog-web/build.sh

      - name: Build release binary
        env:
          QMAKE: /usr/bin/qmake6
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: cargo build --release --locked

      - name: Verify shared codecs and archive extraction
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: cargo test --release --locked -p kog-audio --lib optional_

      - name: Build self-contained terminal and server bundles
        if: github.event_name != 'workflow_dispatch' || inputs.build_cli
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: |
          cargo build --release --locked -p kog-terminal --bins
          packaging/cli/package.sh linux x86_64

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'workflow_dispatch' || inputs.build_cli
        with:
          name: kog-linux-tui
          if-no-files-found: error
          path: dist/cli/Kog-*-linux-x86_64-tui.tar.gz

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'workflow_dispatch' || inputs.build_cli
        with:
          name: kog-linux-server
          if-no-files-found: error
          path: dist/cli/Kog-*-linux-x86_64-server.tar.gz

      - name: Build AppImage and portable AppDir
        env:
          QMAKE: /usr/bin/qmake6
        run: packaging/linux/package-appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: kog-linux-appimage
          if-no-files-found: error
          path: |
            dist/linux/Kog-*.AppImage
            dist/linux/Kog-*-portable.tar.gz

  linux-flatpak:
    name: Linux Flatpak repository
    if: (github.event_name != 'workflow_dispatch' || !inputs.mobile_only) && (!inputs.platform || inputs.platform == 'all' || inputs.platform == 'flatpak')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            elfutils flatpak flatpak-builder librsvg2-common zstd
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Generate locked Cargo sources
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/1fc32195e3e60fe5c97f0af646dec7a99df5962b/cargo/flatpak-cargo-generator.py \
            --output /tmp/flatpak-cargo-generator.py
          uv run /tmp/flatpak-cargo-generator.py Cargo.lock \
            --output packaging/linux/cargo-sources.json
          git diff --exit-code -- packaging/linux/cargo-sources.json

      - name: Install KDE SDK
        run: |
          flatpak install --user --noninteractive -y flathub \
            org.kde.Platform//6.10 org.kde.Sdk//6.10 \
            io.qt.qtwebengine.BaseApp//6.10 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Check Qt compatibility in the Flatpak WebEngine SDK
        run: |
          # kog_desktop_integration now includes the modern-skin bridge, whose
          # headers and .pc files come from the WebEngine BaseApp rather than
          # org.kde.Sdk.  --devel selects that BaseApp's SDK environment.
          # Expand the quoted script inside the sandbox, not on the runner.
          # shellcheck disable=SC2016
          flatpak run --user --devel --filesystem="$GITHUB_WORKSPACE":ro \
            --env=KOG_CI_WORKSPACE="$GITHUB_WORKSPACE" --command=bash \
            io.qt.qtwebengine.BaseApp//6.10 -euc '
              export PKG_CONFIG_PATH="/app/lib/$(gcc -print-multiarch)/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
              # BaseApp keeps private WebEngine shared-library dependencies
              # in /app/lib while its Qt .pc files use the multiarch libdir.
              export KOG_QTWEBENGINE_RPATH_LINK=/app/lib
              bash "${KOG_CI_WORKSPACE:?}/tests/native/run-window-state.sh"
            '

      - name: Check Qt WebEngine BaseApp payload
        run: |
          flatpak run --user --command=bash io.qt.qtwebengine.BaseApp//6.10 -ec '
            test -f /app/lib/libQt6WebEngineCore.so
            test -f /app/lib/libQt6WebEngineQuick.so
            test -x /app/bin/QtWebEngineProcess
            test -f /app/resources/qtwebengine_resources.pak
            test -f /app/resources/qtwebengine_resources_100p.pak
            test -f /app/resources/qtwebengine_resources_200p.pak
            test -f /app/translations/qtwebengine_locales/en-US.pak
            test -f /app/lib/qml/QtWebEngine/qmldir
            find /usr/lib -name "libQt6WebChannel.so*" -type f -print -quit | grep -q .
          '

      - name: Install Rust for the web frontend
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build web frontend
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          crates/kog-web/build.sh

      - name: Build Flatpak and OSTree repository
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          mkdir -p dist/flatpak/repo
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=dist/flatpak/repo flatpak-build \
            packaging/linux/org.kog.player.yml
          flatpak build-bundle dist/flatpak/repo \
            "dist/flatpak/Kog-$version-linux-x86_64.flatpak" org.kog.player
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C dist/flatpak --zstd \
            -cf "dist/flatpak/Kog-$version-linux-x86_64-flatpak-repo.tar.zst" repo

      - uses: actions/upload-artifact@v7
        with:
          name: kog-linux-flatpak
          if-no-files-found: error
          path: |
            dist/flatpak/Kog-*.flatpak
            dist/flatpak/Kog-*-flatpak-repo.tar.zst

  windows:
    name: Windows EXE and MSI
    if: (github.event_name != 'workflow_dispatch' || !inputs.mobile_only) && (!inputs.platform || inputs.platform == 'all' || inputs.platform == 'windows')
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # compress-tools' vcpkg crate probes x64-windows-static-md unless told
      # to use the dynamic triplet that this job installs and packages.
      VCPKGRS_DYNAMIC: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          modules: "qtpositioning qtwebchannel qtwebengine"
          cache: true

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/AppData/Local/vcpkg/archives
          # Bump this suffix when the vcpkg package list below changes.
          key: vcpkg-windows-2025-x64-windows-v2
          restore-keys: vcpkg-windows-2025-x64-windows-v1

      - name: Install native dependencies
        shell: pwsh
        run: |
          # pkgconfiglite downloads from SourceForge, which intermittently
          # times out; retry so the failure surfaces here, not 40 minutes
          # later inside cargo.
          foreach ($package in @("pkgconfiglite", "wixtoolset")) {
            for ($attempt = 1; $attempt -le 3; ++$attempt) {
              choco install $package -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "choco install $package failed after 3 attempts" }
              Start-Sleep -Seconds 20
            }
          }
          if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) {
            throw "pkg-config is not on PATH after installation"
          }
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } elseif ($env:VCPKG_ROOT) {
            $env:VCPKG_ROOT
          } else {
            throw "The GitHub runner did not provide a vcpkg installation"
          }
          & "$vcpkgRoot\vcpkg.exe" install `
            "ffmpeg[avcodec,avformat,swresample]:x64-windows" `
            "libarchive:x64-windows" "zlib:x64-windows"
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$vcpkgRoot\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$vcpkgRoot\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          $vcpkgLib = Join-Path $vcpkgRoot "installed/x64-windows/lib"
          if (-not (Test-Path (Join-Path $vcpkgLib "z.lib"))) {
            throw "vcpkg did not install z.lib in $vcpkgLib"
          }
          "LIB=$vcpkgLib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Save immediately after a successful install. The combined cache action
      # only saves after the whole job succeeds, which discarded the expensive
      # vcpkg build whenever a later application link failed.
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}

      - name: Build web frontend
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          crates/kog-web/build.sh

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked

      - name: Verify shared codecs and archive extraction
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_ROOT\installed\x64-windows\bin;$env:PATH"
          cargo test --release --locked -p kog-audio --lib optional_

      - name: Build portable EXE bundle and MSI
        shell: pwsh
        run: packaging/windows/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: kog-windows
          if-no-files-found: error
          path: |
            dist/windows/Kog-*-portable.zip
            dist/windows/Kog-*.msi

  macos:
    name: macOS DMG (arm64)
    if: (github.event_name != 'workflow_dispatch' || !inputs.mobile_only) && (!inputs.platform || inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: "qtpositioning qtwebchannel qtwebengine"
          cache: true

      - name: Install native dependencies
        run: brew install cmake ffmpeg libarchive librsvg ninja pkg-config zlib

      - name: Configure dependency paths
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix ffmpeg);$(brew --prefix libarchive);$(brew --prefix zlib)" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
          rustup default stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-macos-arm64-${{ hashFiles('Cargo.lock') }}

      - name: Build web frontend
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          crates/kog-web/build.sh

      - name: Build release binary
        env:
          RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names
        run: cargo build --release --locked

      - name: Verify shared codecs and archive extraction
        env:
          RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names
        run: cargo test --release --locked -p kog-audio --lib optional_

      - name: Build self-contained terminal and server bundles
        if: github.event_name != 'workflow_dispatch' || inputs.build_cli
        env:
          RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names
        run: |
          cargo build --release --locked -p kog-terminal --bins
          packaging/cli/package.sh macos arm64

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'workflow_dispatch' || inputs.build_cli
        with:
          name: kog-macos-arm64-tui
          if-no-files-found: error
          path: dist/cli/Kog-*-macos-arm64-tui.tar.gz

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'workflow_dispatch' || inputs.build_cli
        with:
          name: kog-macos-arm64-server
          if-no-files-found: error
          path: dist/cli/Kog-*-macos-arm64-server.tar.gz

      - name: Build application DMG
        run: |
          bash tests/test-dmg-retry.sh
          packaging/macos/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: kog-macos-arm64
          if-no-files-found: error
          path: dist/macos/Kog-*.dmg

  android:
    name: Android APK (arm64)
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build arm64 Kog decoders
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" android/native/build.sh arm64-v8a release
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Package Android download
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          mkdir -p dist/android
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist/android/Kog-$version-android-arm64-unsigned.apk"
          printf 'Android source commit: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign release APK
        if: github.event_name != 'pull_request' && github.repository == 'benwbooth/Kog'
        env:
          KOG_ANDROID_KEYSTORE_BASE64: ${{ secrets.KOG_ANDROID_KEYSTORE_BASE64 }}
          KOG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KOG_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KOG_ANDROID_KEYSTORE_BASE64:?Android release signing key is not configured}"
          : "${KOG_ANDROID_KEYSTORE_PASSWORD:?Android release signing password is not configured}"
          umask 077
          key=$(mktemp "$RUNNER_TEMP/kog-android-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KOG_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          unsigned=$(find dist/android -name '*-unsigned.apk' -print -quit)
          signed=${unsigned%-unsigned.apk}.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$key" --ks-key-alias kog-android-release \
            --ks-pass env:KOG_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:KOG_ANDROID_KEYSTORE_PASSWORD \
            --out "$signed" "$unsigned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$signed"
          rm "$unsigned"
      - name: Verify release APK
        run: |
          set -euo pipefail
          apk=$(find dist/android -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/kog-apk-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/kog-apk-badging.txt"; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/kog-apk-badging.txt"
          cmp LICENSE <(unzip -p "$apk" assets/LICENSE)
          cmp THIRD_PARTY_NOTICES.md <(unzip -p "$apk" assets/THIRD_PARTY_NOTICES.md)
      - uses: actions/upload-artifact@v7
        with:
          name: kog-android
          path: dist/android/Kog-*-android-arm64*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (arm64, unsigned)
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-15
    timeout-minutes: 240
    env:
      NATIVE_JOBS: 3
      # macos-15 still defaults to Xcode 16.4. Kog uses the Swift-managed
      # MediaToolbox ownership annotations in the iOS 26 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
      - name: Install iOS build tools
        run: |
          brew install cmake ninja pkg-config xcodegen
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Check Swift against the selected iOS SDK
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library \
            -D KOG_NATIVE_AUDIO -module-name Kog -target arm64-apple-ios17.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" ios/Kog/*.swift
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-ios-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Build iPhone app and shared Rust decoders
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Kog.xcodeproj -scheme Kog -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/kog-ios" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          app="$RUNNER_TEMP/kog-ios/Build/Products/Release-iphoneos/Kog.app"
          test -x "$app/Kog"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$version"
          plutil -lint "$app/Info.plist"
          xcrun lipo "$app/Kog" -verify_arch arm64
          mkdir -p dist/ios/Payload
          ditto "$app" dist/ios/Payload/Kog.app
          (cd dist/ios && ditto -c -k --keepParent Payload "Kog-$version-ios-arm64-unsigned.ipa")
          printf 'iOS source commit: %s\n\nThis IPA needs device signing before installation.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: kog-ios-unsigned
          path: dist/ios/Kog-*-ios-arm64-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.mobile_only && inputs.source_ref == '' && (!inputs.platform || inputs.platform == 'all')
    needs: [linux-appimage, linux-flatpak, windows, macos, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: kog-*
          path: dist/release
          merge-multiple: true

      - name: Generate Homebrew cask
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "$GITHUB_REF_NAME" = "v$version"
          arm_dmg="$(find dist/release -name 'Kog-*-macos-arm64.dmg' -print -quit)"
          test -n "$arm_dmg"
          packaging/macos/render-cask.sh "$GITHUB_REF_NAME" \
            "$arm_dmg" dist/release/kog.rb

      - name: Create GitHub release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Kog ${GITHUB_REF_NAME#v}" --generate-notes
          # Large-asset uploads flake (HTTP 4xx/5xx from the uploads API):
          # retry each file so one failure neither aborts the rest nor
          # fails the release.
          find dist/release -maxdepth 1 -type f -print0 | sort -z | \
          while IFS= read -r -d '' asset; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" --clobber "$asset"; then
                break
              fi
              echo "Upload of $asset failed (attempt $attempt), retrying..."
              sleep 60
              if [ "$attempt" = 5 ]; then
                echo "Upload of $asset failed permanently" >&2
                exit 1
              fi
            done
          done

  distribution:
    name: Update package repositories
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.mobile_only && inputs.source_ref == '' && (!inputs.platform || inputs.platform == 'all')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/distribution.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
