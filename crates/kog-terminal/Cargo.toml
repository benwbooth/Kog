[package]
name = "kog-terminal"
version = "0.9.41"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Kog's native terminal and headless server frontends"

[dependencies]
kog-core = { path = "../kog-core" }
kog-audio = { path = "../kog-audio" }
kog-server = { path = "../kog-server" }
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
serde_json = "1.0.149"
rand = "0.9"
trash = "5.2.9"
base64 = "0.22.1"
lofty = "0.25.1"
serde = { version = "1.0", features = ["derive"] }
url = "2.5.8"
ureq = { version = "3.4.0", features = ["json", "rustls"] }
directories = "6.0"
tempfile = "3.27.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "kog-tui"
path = "src/bin/kog-tui.rs"

[[bin]]
name = "kog-server"
path = "src/bin/kog-server.rs"
