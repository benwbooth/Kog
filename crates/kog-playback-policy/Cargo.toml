[package]
name = "kog-playback-policy"
version = "0.9.42"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Platform-neutral playback order policy shared by Kog frontends"
repository = "https://github.com/benwbooth/Kog"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
