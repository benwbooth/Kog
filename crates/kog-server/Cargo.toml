[package]
name = "kog-server"
version = "0.9.39"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Kog's HTTP/HTTPS API and audio streaming server"
repository = "https://github.com/benwbooth/Kog"

[dependencies]
kog-core = { path = "../kog-core" }
kog-audio = { path = "../kog-audio" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "time",
  "macros",
  "io-util",
  "fs",
] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
rustls = "0.23"
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "http1", "http2", "tokio"] }
rcgen = "0.13"
subtle = "2.6"
sha2 = "0.10"
base64 = "0.22.1"
getrandom = "0.4"
include_dir = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.27.0"
kog-audio = { path = "../kog-audio", features = ["test-util"] }
