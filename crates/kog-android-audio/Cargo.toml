[package]
name = "kog-android-audio"
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "JNI bridge to Kog's shared audio decoders"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
kog-audio = { path = "../kog-audio" }
kog-server = { path = "../kog-server" }
serde_json = "1"
