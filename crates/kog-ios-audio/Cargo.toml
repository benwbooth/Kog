[package]
name = "kog-ios-audio"
version = "0.9.41"
edition = "2024"
license = "GPL-3.0-or-later"
description = "C ABI bridge to Kog's shared decoders for iOS"

[lib]
crate-type = ["staticlib"]

[dependencies]
kog-audio = { path = "../kog-audio" }
kog-core = { path = "../kog-core" }
kog-server = { path = "../kog-server" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false }
