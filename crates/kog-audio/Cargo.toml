[package]
name = "kog-audio"
version = "0.9.34"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Kog's decoding, playback, and radio engine"
repository = "https://github.com/benwbooth/Kog"

[features]
# Test-only fixture helpers (archive zip writers and friends) that the UI
# crate's tests reuse. Enabled through dev-dependencies so release builds
# never carry them.
test-util = []

[dependencies]
kog-core = { path = "../kog-core" }
compress-tools = "0.16.1"
directories = "6.0.0"
encoding_rs = "0.8.35"
lofty = "0.25.1"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
orgorg = "=0.2.1"
percent-encoding = "2.3.2"
rodio = { version = "0.22.2", default-features = false, features = [
  "playback",
  "symphonia-all",
] }
rustysynth = "1.3.6"
self_cell = "1.2.1"
serde_json = "1.0.149"
tempfile = "3.27.0"
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2.5.0"
futures-lite = "2.6.1"

[build-dependencies]
cc = "1.2.38"
cmake = "0.1.58"
pkg-config = "0.3.32"
