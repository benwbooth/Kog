[package]
name = "kog-web"
version = "0.9.39"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Kog's web frontend"
repository = "https://github.com/benwbooth/Kog"
publish = false

# Standalone: this crate is wasm-only and built separately from the desktop
# workspace, so host builds and the Flatpak vendor list stay unaffected.
[workspace]

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = "0.7.0"
js-sys = "=0.3.98"
leptos = { version = "0.8.20", default-features = false, features = ["csr"] }
serde = "1.0.229"
serde_json = "1.0.151"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = [
  "Window",
  "Storage",
  "Location",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlElement",
  "HtmlAudioElement",
  "HtmlMediaElement",
  "TimeRanges",
  "DataTransfer",
  "DragEvent",
  "MouseEvent",
  "MouseEventInit",
  "TouchEvent",
  "TouchList",
  "Touch",
  "AddEventListenerOptions",
  "PointerEvent",
  "console",
] }

[lib]
crate-type = ["cdylib", "rlib"]
