<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Mobile first: the same app has to be usable on a phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Kog web player" />
    <!-- Home screen installs: the PNG is what iOS pins (it cannot use the SVG
         favicon), the manifest drives Android and the standalone launch. -->
    <!-- Match supporting browser chrome to the toolbar in each color scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202427" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7e9ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Keep the app below iOS's status bar. The translucent mode draws the
         toolbar behind the camera area, where iOS obscures/blurs it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kog" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The ?v busts Safari's touch-icon cache: iOS pins the icon at
         add-to-home-screen time and never refreshes an existing one. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=3" />
    <title>Kog</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/icons/kog.svg" />
  </head>
  <body>
    <div id="app"></div>
    <!-- The player mounts into <body>. This note stays on screen until it does,
         so a browser that cannot run the wasm says why instead of showing an
         empty window. -->
    <div
      id="boot"
      style="font: 14px/1.5 system-ui, sans-serif; padding: 24px; color: CanvasText"
    >
      <p>Loading the Kog player…</p>
      <p id="boot-detail"></p>
    </div>
    <noscript>
      <p style="font: 14px/1.5 system-ui, sans-serif; padding: 24px">
        Kog needs JavaScript, and it is turned off in this browser.
      </p>
    </noscript>
    <script type="module">
      const boot = document.getElementById("boot");
      const detail = document.getElementById("boot-detail");
      const environment =
        "This browser: " +
        navigator.userAgent +
        " — WebAssembly: " +
        (typeof WebAssembly !== "undefined");
      const report = (message) => {
        if (detail) detail.textContent = message;
      };
      const mounted = () => document.querySelector(".app") !== null;

      addEventListener("error", (event) =>
        report("A script error occurred: " + (event.message || event.error)));
      addEventListener("unhandledrejection", (event) =>
        report("A promise was rejected: " + event.reason));

      // A dynamic import so a module that will not parse or download is also
      // reported, not just a wasm that fails to start.
      import("/kog_web.js")
        .then((module) => module.default())
        .then(() => {
          if (mounted()) {
            boot.remove();
          } else {
            report("The player started but drew nothing. " + environment);
          }
        })
        .catch((error) => report("The player failed to load: " + error));

      setTimeout(() => {
        if (!mounted()) {
          report(
            (detail && detail.textContent ? detail.textContent + " " : "") +
              "Still nothing after 10 seconds. " +
              environment,
          );
        }
      }, 10000);
    </script>
    <script>
      // A pane shows its scrollbar only while the pointer is over the bar
      // itself (or dragging it), as the desktop window does. CSS cannot tell
      // a hover over the bar from one over the content, so this marks the
      // scrolling element whose bar strip is under the pointer.
      (() => {
        let marked = null;
        const mark = (element) => {
          if (marked === element) return;
          marked?.classList.remove("scrollbar-hover");
          marked = element;
          marked?.classList.add("scrollbar-hover");
        };
        const barUnder = (target, x, y) => {
          // Every element under the pointer, not just the topmost: a
          // splitter's grab zone can overlap the edge of the pane beside it.
          const seen = new Set();
          for (const top of document.elementsFromPoint(x, y)) {
            const found = barAbove(top, x, y, seen);
            if (found) return found;
          }
          return null;
        };
        const barAbove = (target, x, y, seen) => {
          for (let element = target; element && element !== document; element = element.parentElement) {
            if (seen.has(element)) break;
            seen.add(element);
            if (!(element instanceof Element)) continue;
            const vertical = element.offsetWidth - element.clientWidth;
            const horizontal = element.offsetHeight - element.clientHeight;
            if (vertical <= 0 && horizontal <= 0) continue;
            const box = element.getBoundingClientRect();
            if ((vertical > 0 && x >= box.right - vertical && x <= box.right)
                || (horizontal > 0 && y >= box.bottom - horizontal && y <= box.bottom)) {
              return element;
            }
          }
          return null;
        };
        let dragging = false;
        addEventListener("pointermove", (event) => {
          if (!dragging) mark(barUnder(event.target, event.clientX, event.clientY));
        }, { passive: true });
        addEventListener("pointerdown", (event) => {
          dragging = marked !== null && barUnder(event.target, event.clientX, event.clientY) === marked;
        });
        addEventListener("pointerup", () => { dragging = false; });
        document.addEventListener("pointerleave", () => { if (!dragging) mark(null); });
        // A pane also shows its bar for a moment after it scrolls (wheel,
        // trackpad or keyboard), as the desktop window does.
        const idle = new WeakMap();
        document.addEventListener("scroll", (event) => {
          const element = event.target;
          if (!(element instanceof Element)) return;
          element.classList.add("scrollbar-scrolling");
          clearTimeout(idle.get(element));
          idle.set(element, setTimeout(() => element.classList.remove("scrollbar-scrolling"), 900));
        }, { capture: true, passive: true });
      })();
    </script>
  </body>
</html>
