<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Mobile first: the same app has to be usable on a phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Kog web player" />
    <title>Kog</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/icons/kog.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import init from "/kog_web.js";
      // A failure here used to leave a blank page. Say so instead, and point at
      // the usual cause: a stale cached script from a previous build.
      init().catch((error) => {
        const target = document.getElementById("app");
        target.style.padding = "24px";
        target.textContent =
          "The player failed to load (" + error + "). Reload the page with " +
          "Ctrl+Shift+R to clear a stale cached build.";
      });
    </script>
  </body>
</html>
