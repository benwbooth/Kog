<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gear" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64b5f6"/>
      <stop offset="1" stop-color="#1976d2"/>
    </linearGradient>
  </defs>
  <g fill="url(#gear)">
    <!-- One tooth, rotated in exact 45-degree steps about the gear's
         center: every spoke is identical in length, width, and gap. -->
    <rect x="27" y="1" width="10" height="15" rx="3"/>
    <rect x="27" y="1" width="10" height="15" rx="3" transform="rotate(45 32 32)"/>
    <rect x="27" y="1" width="10" height="15" rx="3" transform="rotate(90 32 32)"/>
    <rect x="27" y="1" width="10" height="15" rx="3" transform="rotate(135 32 32)"/>
    <rect x="27" y="1" width="10" height="15" rx="3" transform="rotate(180 32 32)"/>
    <rect x="27" y="1" width="10" height="15" rx="3" transform="rotate(225 32 32)"/>
    <rect x="27" y="1" width="10" height="15" rx="3" transform="rotate(270 32 32)"/>
    <rect x="27" y="1" width="10" height="15" rx="3" transform="rotate(315 32 32)"/>
    <circle cx="32" cy="32" r="23"/>
  </g>
  <circle cx="32" cy="32" r="14.5" fill="#172033"/>
  <path fill="#fff" transform="translate(14.6 15.65) scale(1.45)"
        d="M12 3v10.55A4 4 0 0 0 10 13c-2.21 0-4 1.34-4 3s1.79 3 4 3 4-1.34 4-3V7h4V3z"/>
</svg>
