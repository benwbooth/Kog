name: Kog
options:
  bundleIdPrefix: org.kog
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
targets:
  Kog:
    type: application
    platform: iOS
    sources:
      - path: Kog
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kog.player
        INFOPLIST_FILE: Kog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KOG_NATIVE_AUDIO"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.native-build/xcode"
        OTHER_LDFLAGS: "$(inherited) -lkog_ios_audio -larchive -lavformat -lavcodec -lavutil -lswresample -lc++ -lz -liconv -framework AudioToolbox -framework CoreAudio -framework CoreFoundation -framework Security -framework VideoToolbox"
    preBuildScripts:
      - name: Build shared Rust decoders
        basedOnDependencyAnalysis: false
        script: |
          set -e
          case "$PLATFORM_NAME" in
            iphoneos) target=device ;;
            iphonesimulator) target=simulator ;;
            *) echo "Unsupported iOS platform: $PLATFORM_NAME" >&2; exit 2 ;;
          esac
          "$SRCROOT/native/build.sh" "$target"
          mkdir -p "$SRCROOT/.native-build/xcode"
          if [ "$target" = device ]; then triple=aarch64-apple-ios; else triple=aarch64-apple-ios-sim; fi
          cp "$SRCROOT/../target/$triple/release/libkog_ios_audio.a" "$SRCROOT/.native-build/xcode/libkog_ios_audio.a"
          cp "$SRCROOT/.native-build/$target/prefix/lib/"*.a "$SRCROOT/.native-build/xcode/"
