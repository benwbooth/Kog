[package]
name = "kog"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "A cross-platform, format-comprehensive local music player"
repository = "https://github.com/benwbooth/Kog"

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
directories = "6.0.0"
lofty = "0.25.1"
rodio = { version = "0.22.2", default-features = false, features = [
  "playback",
  "symphonia-all",
] }
rustysynth = "1.3.6"
midly = { version = "0.5.3", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1.2.38"
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
